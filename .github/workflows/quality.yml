name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_sandbox_e2e:
        description: Run Docker and macOS sandbox end-to-end tests
        required: true
        default: false
        type: boolean

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit:release

  sandbox:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            docker: '0'
            macos: '0'
          - os: macos-latest
            docker: '0'
            macos: '0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentcorps/security test
        env:
          AGENTCORPS_DOCKER_E2E: ${{ github.event_name == 'workflow_dispatch' && inputs.run_sandbox_e2e && '1' || matrix.docker }}
          AGENTCORPS_MACOS_SANDBOX_E2E: ${{ github.event_name == 'workflow_dispatch' && inputs.run_sandbox_e2e && '1' || matrix.macos }}
      - if: matrix.os == 'macos-latest'
        run: pnpm --filter @agentcorps/desktop build:desktop
